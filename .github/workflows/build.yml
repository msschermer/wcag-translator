name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # W3C republish the JSON monthly, so rebuild on a schedule to keep the baked
  # in dataset current without needing a code change.
  schedule:
    - cron: "0 6 5 * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/msschermer/wcag-translator:latest
            ghcr.io/msschermer/wcag-translator:${{ github.sha }}
